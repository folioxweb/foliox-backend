name: Deploy to Supabase

on:
  push:
    branches:
      - main
      - uat
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Migrations & Edge Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Target Environment
        id: env-config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Environment: PRODUCTION"
            echo "PROJECT_ID=${{ secrets.SUPABASE_PROD_PROJECT_ID }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.SUPABASE_PROD_DB_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Environment: UAT / STAGING"
            echo "PROJECT_ID=${{ secrets.SUPABASE_UAT_PROJECT_ID }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.SUPABASE_UAT_DB_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Link Supabase Project
        run: supabase link --project-ref ${{ env.PROJECT_ID }} --password ${{ env.DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push Database Migrations
        run: supabase db push --password ${{ env.DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref ${{ env.PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
